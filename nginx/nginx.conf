events {
    worker_connections 1024;
}

http {
    # HTTP → HTTPS redirect + certbot challenge
    server {
        listen 80;
        server_name api.dragonflex.ru admin.dragonflex.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API — для мобильного приложения
    server {
        listen 443 ssl;
        server_name api.dragonflex.ru;

        ssl_certificate     /etc/letsencrypt/live/api.dragonflex.ru-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.dragonflex.ru-0001/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://api-gateway:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    # Админ панель
    server {
        listen 443 ssl;
        server_name admin.dragonflex.ru;

        ssl_certificate     /etc/letsencrypt/live/admin.dragonflex.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.dragonflex.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://admin-panel:80;
            proxy_set_header Host $host;
        }
    }
}
